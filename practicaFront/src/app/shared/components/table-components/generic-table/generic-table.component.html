<p-table
  #dt
  [tableStyle]="{ 'min-width': '50rem' }"
  [value]="content"
  showGridlines
  [paginator]="paginated"
  showCurrentPageReport
  [lazy]="true"
  (onPage)="onPagination($event)"
  [rows]="paginatedData.size"
  [totalRecords]="paginatedData.totalElements"
  [rowsPerPageOptions]="rowSize"
  [currentPageReportTemplate]="
    'Showing {first} to {last} of {totalRecords} entries'
  "
  (onSort)="onSortedColumn($event)"
  (onFilter)="onColumnFilter($event)"
>
  <ng-template #caption>
    <div class="flex">
      <p-button
        label="Clear"
        [outlined]="true"
        icon="pi pi-filter-slash"
        (click)="clear()"
      />
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <ng-container *ngFor="let field of alias">
        <th
          *ngIf="field !== 'Actions' && checkType(field) !== 'date'"
          style="min-width: 10rem"
        >
          <input
            pInputText
            [type]="checkType(field)"
            [placeholder]="field"
            (input)="onInputChange($event, field, getMatchMode(field))"
          />
        </th>
        <th
          *ngIf="field !== 'Actions' && checkType(field) === 'date'"
          style="min-width: 10rem"
        >
          <div class="flex flex-column gap-2">
            <input
              pInputText
              type="date"
              [placeholder]="'After ' + field"
              (input)="onDateAfterChange($event, field)"
            />
            <input
              pInputText
              type="date"
              [placeholder]="'Before ' + field"
              (input)="onDateBeforeChange($event, field)"
            />
          </div>
        </th>
        <th *ngIf="field === 'Actions'" style="min-width: 10rem"></th>
      </ng-container>
    </tr>

    <tr>
      <ng-container *ngFor="let field of alias">
        <th
          *ngIf="field !== 'Actions' && checkType(field) !== 'date'"
          [pSortableColumn]="field"
          style="min-width: 10rem"
        >
          <div class="flex items-center">
            {{ field }}
            <p-columnFilter
              [type]="checkType(field)"
              [field]="getField(field)"
              display="menu"
            />
          </div>
        </th>
        <th
          *ngIf="field !== 'Actions' && checkType(field) === 'date'"
          [pSortableColumn]="field"
          style="min-width: 10rem"
        >
          <div class="flex items-center">
            {{ field }}
          </div>
        </th>
        <th *ngIf="field === 'Actions'" style="min-width: 10rem">
          {{ field }}
        </th>
      </ng-container>
      <th
        *ngIf="config.buttons && !hasActionsColumn()"
        style="min-width: 10rem"
      >
        Actions
      </th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-object>
    <!--    Celdas de la tabla-->
    <tr>
      <td *ngFor="let field of fields">
        {{ this.objectCheck(object, field) }}
      </td>

      <!--      Botones (en caso de haber sido pasados en config)-->
      <td class="flex gap-2">
        <p-button
          *ngFor="let button of config.buttons"
          [icon]="button.icon"
          [styleClass]="button.styleClass || 'p-button-sm'"
          (click)="onActionClick(button.action.toLowerCase(), object)"
          >{{ button.action }}
        </p-button>
      </td>
    </tr>
  </ng-template>
</p-table>
